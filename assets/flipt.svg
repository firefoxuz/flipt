<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Flipt</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
    <!-- stem of the F -->
    <rect x="31" y="31" width="12" height="68" rx="3"/>
    <!-- top bar: an arrow pointing right (text going out) -->
    <rect x="31" y="31" width="48" height="12" rx="3"/>
    <path d="M80 21 L100 37 L80 53 Z"/>
    <!-- middle bar: an arrow pointing back (the translation coming in) -->
    <rect x="76" y="71" width="24" height="12" rx="3"/>
    <path d="M76 62 L57 77 L76 92 Z"/>
  </g>
</svg>
